name: Editor validation
on:
  push:
    branches: [feat/studio-ux-gpu]
    paths: [.github/workflows/editor-dev-bundle.yml]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Compile native shared-texture bridge
        run: ./scripts/build-gpu-preview.ps1 -OutputDirectory artifacts/frontend
      - name: Publish WinUI
        run: dotnet publish src/OurNotes.Director.WinUI -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishReadyToRun=false -o artifacts/frontend --nologo
