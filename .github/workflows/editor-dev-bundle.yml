name: Editor development bundle
on:
  push:
    branches: [feat/studio-ux-gpu]
    paths: [.github/workflows/editor-dev-bundle.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      NUGET_PACKAGES: ${{ github.workspace }}/.dev-nuget
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive exact tracked source
        run: |
          mkdir -p dev-bundle
          git archive --format=tar HEAD | gzip > dev-bundle/source.tar.gz
          git rev-parse HEAD > dev-bundle/source-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: editor-source
          path: dev-bundle/source*
          retention-days: 3
      - name: Prepare isolated .NET SDK and dependencies
        run: |
          curl --fail --silent --show-error --location https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$RUNNER_TEMP/editor-sdk"
          "$RUNNER_TEMP/editor-sdk/dotnet" restore OurNotes.Director.sln -r linux-x64
          tar -czf dev-bundle/dotnet-sdk.tar.gz -C "$RUNNER_TEMP/editor-sdk" .
          tar -czf dev-bundle/nuget-cache.tar.gz -C .dev-nuget .
      - uses: actions/upload-artifact@v7
        with:
          name: editor-offline-sdk
          path: |
            dev-bundle/dotnet-sdk.tar.gz
            dev-bundle/nuget-cache.tar.gz
          compression-level: 0
          retention-days: 3
