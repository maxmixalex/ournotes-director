name: Apply verified studio corrections
on:
  push:
    branches: [feat/studio-ux-gpu]
    paths: [.github/workflows/editor-dev-bundle.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply tested source patch
        shell: bash
        run: |
          python - <<'PY'
          import gzip, hashlib, pathlib
          data = gzip.decompress(pathlib.Path('.dev/studio-fixes.patch.gz').read_bytes())
          expected = '5b6b43a2a1886bf6210a509c314cb1ebe6f1dbbf978e127288ff80be33e1da9c'
          assert hashlib.sha256(data).hexdigest() == expected, 'Source transfer checksum mismatch'
          pathlib.Path('/tmp/studio-fixes.patch').write_bytes(data)
          PY
          git apply --check /tmp/studio-fixes.patch
          git apply /tmp/studio-fixes.patch
          git diff --check
          git rm .dev/studio-fixes.patch.gz
          git add STUDIO_DESIGN.md native src tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve evaluated character timing and stabilize studio GPU presentation'
          git push origin HEAD:refs/heads/feat/studio-ux-gpu
