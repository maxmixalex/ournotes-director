name: Verify and apply recovered editor fixes
on:
  push:
    branches: [feat/windows-creative-editor]
    paths: ['scripts/transfer-20261020/**', '.github/workflows/transfer-20261020.yml']
permissions:
  contents: write
concurrency:
  group: recovered-editor-fixes-20261020
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'maxmixalex/ournotes-director' && github.ref == 'refs/heads/feat/windows-creative-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify exact base and patch bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '24b63b6f2594600efdd21c714c46c3e9aa14c81f'
          test "$(git ls-remote origin refs/heads/feat/windows-creative-editor | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          expected = {
              '01.patch': 'c0818049583f0c10cf9522a4a8ad3b25d92aea6bd78a3c3934f966ea4ae78c27',
              '02.patch': 'd2f87b71a9e1652c96ce4ffc95c476e0b5f0dcf5b6484a59713bd1b848963c45',
              '03.patch': 'a84d912f09dbac1f297703f9a99d3ee9d523aa0c24b587983b2d59cf181ab263',
          }
          for name, digest in expected.items():
              assert sha256((Path('scripts/transfer-20261020') / name).read_bytes()).hexdigest() == digest, name
          print('Verified all three exact patch payloads.')
          PY
          git apply --check --index scripts/transfer-20261020/01.patch scripts/transfer-20261020/02.patch scripts/transfer-20261020/03.patch
          git apply --index scripts/transfer-20261020/01.patch scripts/transfer-20261020/02.patch scripts/transfer-20261020/03.patch
          git diff --cached --check
          git rm -r scripts/transfer-20261020
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build and run managed regressions before publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/transfer-checks
          dotnet build OurNotes.Director.sln -c Release --nologo 2>&1 | tee artifacts/transfer-checks/build.log
          dotnet run --project tests/OurNotes.Director.Tests -c Release --no-build --no-restore 2>&1 | tee artifacts/transfer-checks/core.log
          dotnet run --project tests/OurNotes.Director.Desktop.Tests -c Release --no-build --no-restore 2>&1 | tee artifacts/transfer-checks/desktop.log
      - name: Publish tested source without overwriting another update
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/windows-creative-editor | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unify Live2D selections and commit paused GPU presentation correctly'
          git push origin HEAD:refs/heads/feat/windows-creative-editor
          git rev-parse HEAD | tee artifacts/transfer-checks/applied-commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recovered-editor-managed-checks
          path: artifacts/transfer-checks/*
          if-no-files-found: warn
          retention-days: 14
