name: Integrate native stage authoring
on:
  push:
    branches: [feat/windows-creative-editor]
    paths: [.dev/stage-edit.patch, .github/workflows/stage-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply exact reviewed source patch
        run: |
          $path = (Resolve-Path .dev/stage-edit.patch).Path
          $text = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '6e513cbbfde7f390df838910eb8e282f35011b44452d428c1ec5fcee4236d23a') { throw 'Source patch transfer mismatch' }
          git apply --check --unidiff-zero .dev/stage-edit.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --unidiff-zero .dev/stage-edit.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rm .dev/stage-edit.patch
          git add src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Show selected stages immediately and expose material fades as normal UI choices'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/feat/windows-creative-editor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
