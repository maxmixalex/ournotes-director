name: Integrate short-shot editing
on:
  push:
    branches: [feat/windows-creative-editor]
    paths: [.dev/short-shot/**, .github/workflows/short-shot-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify and apply literal editor patch
        run: |
          python .dev/short-shot/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --unidiff-zero --check "$env:RUNNER_TEMP/short-shot.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --unidiff-zero "$env:RUNNER_TEMP/short-shot.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile engine and editing models
        run: dotnet build OurNotes.Director.sln -c Release --nologo
      - name: Compile Windows workbench
        run: dotnet build src/OurNotes.Director.WinUI -c Release -p:Platform=x64 -p:PublishReadyToRun=false --nologo
      - name: Verify editing behavior
        run: dotnet run --project tests/OurNotes.Director.Desktop.Tests -c Release --no-build --no-restore
      - name: Preserve compiled source changes
        run: |
          git rm -r .dev/short-shot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add src tests CREATIVE_EDITOR_PROGRESS.md DESKTOP.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make short-shot ranges and cancellable preview scrubbing first-class editor operations'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/feat/windows-creative-editor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
