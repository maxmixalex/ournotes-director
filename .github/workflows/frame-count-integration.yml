name: Apply frame-exact output correction
on:
  push:
    branches: [feat/windows-creative-editor]
    paths: [.dev/frame-count.patch, .github/workflows/frame-count-integration.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply the locally verified literal patch
        run: |
          python -c "from pathlib import Path; import hashlib; p=Path('.dev/frame-count.patch'); b=p.read_text(encoding='utf-8-sig').encode(); assert hashlib.sha256(b).hexdigest() == '535c77b80c874dac9520a1efc3468e62fc3ab290669191f47e0834457d8943f0'; p.write_bytes(b)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check .dev/frame-count.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply .dev/frame-count.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rm -f .dev/frame-count.patch
          git add src tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use consistent frame rounding for video, PNG sequences and audio preparation'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/feat/windows-creative-editor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
