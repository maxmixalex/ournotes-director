name: Build Windows editor
on:
  push:
    branches: [main, feat/windows-creative-editor]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-editor-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build engine and editing models
        run: dotnet build OurNotes.Director.sln -c Release --nologo
      - name: Compile the actual Windows frontend early
        run: dotnet build src/OurNotes.Director.WinUI -c Release -p:Platform=x64 -p:PublishReadyToRun=false --nologo
      - name: Check core and document regressions
        run: |
          dotnet run --project tests/OurNotes.Director.Tests -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/OurNotes.Director.Desktop.Tests -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make diffutils curl tar xz python mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-mesa
      - name: Restore media and native SDK downloads
        id: dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/media-cache/downloads
            artifacts/media-cache/bundle
            artifacts/dependency-cache
          key: native-deps-windows-2022-win-x64-${{ hashFiles('scripts/build-media.sh', 'scripts/media-sources.lock', 'scripts/native-sources.lock.json') }}
      - name: Publish native engine and stage model runtimes
        run: |
          dotnet publish src/OurNotes.Director.Cli -c Release -r win-x64 -o artifacts/win-x64 --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/stage-native.py --rid win-x64 --output artifacts/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tests/OurNotes.Director.NativeTests -c Release -r win-x64 -o artifacts/native-tests --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle FFmpeg and CineForm support
        shell: msys2 {0}
        run: bash scripts/build-media.sh win-x64 artifacts/win-x64
      - name: Save media cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/media-cache/downloads
            artifacts/media-cache/bundle
            artifacts/dependency-cache
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      - name: Package the Windows editor
        run: |
          ./scripts/build-desktop.ps1 -OutputDirectory artifacts/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md, USER_GUIDE.md, UNIFIED_INTERFACE.md, HOME_SPINE.md, CINEFORM.md, SOURCE_REFERENCES.md, THIRD-PARTY.md, LICENSE artifacts/win-x64
          Copy-Item samples artifacts/win-x64/samples -Recurse
          New-Item -ItemType Directory -Path packages -Force | Out-Null
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath packages/ournotes-director-win-x64.zip
          $hash = (Get-FileHash packages/ournotes-director-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ournotes-director-win-x64.zip" | Set-Content packages/ournotes-director-win-x64.zip.sha256 -Encoding ascii
      - name: Verify transparent media from the extracted package
        run: |
          python tests/package-smoke.py --package packages/ournotes-director-win-x64.zip --native-tests artifacts/native-tests/OurNotes.Director.NativeTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch the new workbench with real scene assets
        run: |
          python scripts/fetch-studio-fixture.py artifacts/real-scene-fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/native-tests/OurNotes.Director.NativeTests.exe --home-fixture artifacts/studio-fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/native-tests/OurNotes.Director.NativeTests.exe --scene-fixture artifacts/studio-fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mesa = Get-ChildItem "$env:RUNNER_TEMP/msys64/ucrt64/bin/opengl32.dll", 'C:/msys64/ucrt64/bin/opengl32.dll', 'D:/a/_temp/msys64/ucrt64/bin/opengl32.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $mesa) { throw 'The test OpenGL driver was not installed.' }
          ./tests/desktop-smoke.ps1 -Package packages/ournotes-director-win-x64.zip -ReportDirectory artifacts/desktop-smoke -FixtureDirectory artifacts/studio-fixture -RealSceneFixtureDirectory artifacts/real-scene-fixture -OpenGLDriver $mesa.FullName -TimeoutSeconds 240
      - name: Preserve actual window evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-creative-editor-evidence
          path: artifacts/desktop-smoke/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ournotes-director-win-x64
          path: packages/*
          if-no-files-found: error
          retention-days: 30
