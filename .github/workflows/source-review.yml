name: Capture editor source
on:
  push:
    branches: [feat/windows-creative-editor]
    paths: [.github/workflows/source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          New-Item -ItemType Directory -Path snapshot -Force | Out-Null
          git archive --format=zip -o snapshot/source.zip HEAD
          git rev-parse HEAD | Set-Content snapshot/commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: staging-source
          path: snapshot/*
          retention-days: 3
